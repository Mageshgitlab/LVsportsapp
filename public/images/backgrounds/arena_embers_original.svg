<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Original ember arena texture">
  <defs>
    <radialGradient id="g1" cx="15%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ff8b3d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#c1121f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0 H0 V120" fill="none" stroke="#d4a017" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <g fill="#ffb36c" fill-opacity="0.15">
