    <circle cx="320" cy="250" r="2.5"/>
    <circle cx="540" cy="145" r="1.8"/>
    <circle cx="760" cy="230" r="2.4"/>
    <circle cx="980" cy="165" r="2"/>
    <circle cx="1240" cy="210" r="2.3"/>
    <circle cx="1450" cy="140" r="2"/>
    <circle cx="1680" cy="230" r="2.4"/>
    <circle cx="1760" cy="170" r="2"/>
  </g>

  <g fill="#ff8b3d" fill-opacity="0.12">
    <ellipse cx="220" cy="920" rx="240" ry="90"/>
    <ellipse cx="860" cy="960" rx="340" ry="120"/>
    <ellipse cx="1580" cy="940" rx="280" ry="100"/>
  </g>
</svg>
