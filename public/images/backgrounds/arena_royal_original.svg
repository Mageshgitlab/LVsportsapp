<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Original royal arena backdrop">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201710"/>
      <stop offset="38%" stop-color="#120f0d"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#ffe1a0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff9b3d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1512"/>
      <stop offset="100%" stop-color="#0f0d0c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <path d="M0 670 L220 520 L430 620 L620 470 L820 610 L1020 520 L1220 620 L1440 500 L1650 620 L1920 480 L1920 1080 L0 1080 Z" fill="#120f0d"/>
  <path d="M0 760 L170 680 L320 730 L500 660 L690 740 L890 690 L1120 760 L1320 680 L1510 760 L1720 700 L1920 760 L1920 1080 L0 1080 Z" fill="#191411"/>

  <ellipse cx="960" cy="760" rx="520" ry="140" fill="#0a0908"/>
  <ellipse cx="960" cy="760" rx="420" ry="95" fill="#2b2118" fill-opacity="0.55"/>

  <g fill="#2f241a" fill-opacity="0.9">
    <rect x="580" y="470" width="28" height="230"/>
    <rect x="700" y="445" width="30" height="255"/>
    <rect x="1220" y="450" width="30" height="250"/>
    <rect x="1340" y="475" width="28" height="225"/>
  </g>

  <g fill="#d4a017" fill-opacity="0.25" filter="url(#soft)">
    <circle cx="600" cy="675" r="8"/>
    <circle cx="760" cy="700" r="6"/>
    <circle cx="930" cy="680" r="7"/>
    <circle cx="1090" cy="700" r="6"/>
    <circle cx="1260" cy="672" r="8"/>
  </g>

  <g transform="translate(960 365)" fill="none" stroke="#8f6a17" stroke-opacity="0.45" stroke-width="14">
    <path d="M-180 0 C-110 -100, 110 -100, 180 0 C110 100, -110 100, -180 0 Z"/>
    <path d="M-130 0 C-75 -65, 75 -65, 130 0 C75 65, -75 65, -130 0 Z"/>
  </g>
</svg>
